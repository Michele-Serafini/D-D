<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Amministrazione · Mercante Errante</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui;background:#17140f;color:#eee6d7}body{max-width:1100px;margin:auto;padding:24px}h1,h2{color:#e0bb6b}section{background:#221e17;border:1px solid #524630;border-radius:12px;padding:24px;margin:20px 0}input,button,a{font:inherit}input,button{padding:12px;border-radius:7px;border:1px solid #746044}input{background:#17140f;color:inherit}button{background:#e0bb6b;color:#211b10;cursor:pointer}button:disabled{opacity:.5;cursor:wait}form{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:8px}a{color:#e0bb6b}li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #524630}ul{list-style:none;padding:0}pre{max-height:60vh;overflow:auto;padding:16px;background:#100e0a;font-size:13px}#admin-status{min-height:24px}[hidden]{display:none!important}form button{align-self:end}
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>Amministrazione database</h1><a href="index.html">← Torna al Compendium</a>
  <section id="login-overlay">
    <h2>Accedi</h2>
    <form id="login-cred-area" onsubmit="event.preventDefault();doSignIn()">
      <label>Nome utente<input id="login-username-input" autocomplete="username" required></label>
      <label>Password<input id="login-password-input" type="password" autocomplete="current-password" required></label>
      <button class="login-btn" type="submit">Accedi</button>
    </form><p id="login-error" role="alert" style="display:none"></p>
  </section>
  <main id="admin-panel" hidden>
    <p id="admin-status" role="status" aria-live="polite"></p>
    <section><h2>Giocatori</h2><ul id="admin-users"></ul>
      <form id="add-player">
        <label>Nome del giocatore<input id="player-name" pattern="[a-zA-Z0-9_-]{3,32}" minlength="3" maxlength="32" required></label>
        <label>Password<input id="player-password" type="password" value="player" minlength="6" autocomplete="new-password" required></label>
        <button type="submit">Aggiungi giocatore</button>
      </form>
    </section>
    <section><h2>Database</h2><button id="export-backup" type="button">Scarica backup completo</button>
      <details open><summary>Visualizza contenuto del database</summary>
        <p>Massimo 25 elementi per percorso. Password e chiavi nascoste; testi lunghi abbreviati.</p>
        <label>Percorso<input id="database-path" value="users" list="database-paths"></label>
        <datalist id="database-paths"><option value="users"><option value="schedePG"><option value="state/pet"><option value="state/armi"><option value="state/bestiario"><option value="libri/books"><option value="state/legacyUserContent"></datalist>
        <button id="load-database" type="button">Carica percorso</button><pre id="admin-database"></pre>
      </details>
    </section>
    <button id="admin-logout" type="button">Esci</button>
  </main>
  <script>var state = {currentUser:null};</script>
  <script src="js/firebase-config.js"></script>
    <script src="js/users.js"></script><script src="js/party-admin.js"></script>
</body>
</html>
