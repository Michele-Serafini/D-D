<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Amministrazione · Mercante Errante</title>
    <link rel="stylesheet" href="css/admin.css" />
    <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script
      defer
      src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"
    ></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <h1>Amministrazione database</h1>
    <a href="index.html">← Torna al Compendium</a>
    <section id="login-overlay">
      <h2>Accedi</h2>
      <form
        id="login-cred-area"
        onsubmit="
          event.preventDefault();
          doSignIn();
        "
      >
        <label
          >Nome utente<input id="login-username-input" autocomplete="username" required
        /></label>
        <label
          >Password<input
            id="login-password-input"
            type="password"
            autocomplete="current-password"
            required
        /></label>
        <button class="login-btn" disabled type="submit">Accedi</button>
      </form>
      <p id="login-error" role="alert" style="display: none"></p>
    </section>
    <main id="admin-panel" hidden>
      <p id="admin-status" role="status" aria-live="polite"></p>
      <section>
        <h2>Giocatori</h2>
        <ul id="admin-users"></ul>
        <form id="add-player">
          <label>Nome del giocatore<input id="player-name" required /></label>
          <label
            >Password<input
              id="player-password"
              type="password"
              value="player"
              autocomplete="new-password"
              required
          /></label>
          <button type="submit">Aggiungi giocatore</button>
        </form>
      </section>
      <section>
        <h2>Database</h2>
        <button id="export-backup" type="button">Scarica backup completo</button>
        <details open>
          <summary>Visualizza contenuto del database</summary>
          <p>
            Massimo 25 elementi per percorso. Password e chiavi nascoste; testi lunghi abbreviati.
          </p>
          <label>Percorso<input id="database-path" value="users" list="database-paths" /></label>
          <datalist id="database-paths">
            <option value="users"></option>
            <option value="schedePG"></option>
            <option value="state/pet"></option>
            <option value="state/armi"></option>
            <option value="state/bestiario"></option>
            <option value="libri/books"></option>
            <option value="state/legacyUserContent"></option>
          </datalist>
          <button id="load-database" type="button">Carica percorso</button>
          <pre id="admin-database"></pre>
        </details>
      </section>
      <button id="admin-logout" type="button">Esci</button>
    </main>
    <script>
      var state = { currentUser: null };
    </script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/users.js"></script>
    <script defer src="js/party-admin.js"></script>
  </body>
</html>
