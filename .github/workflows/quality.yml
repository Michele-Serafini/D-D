name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  database-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run rules:build
      - run: git diff --exit-code database.rules.json
      - run: npm run test:rules
  verify:
    runs-on: ubuntu-latest
    outputs:
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read the installed Playwright version
        id: playwright
        run: node -p "'version=' + require('playwright/package.json').version" >> "$GITHUB_OUTPUT"
      - run: npm run check:secrets
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Validate build with test configuration
        run: npm run build
        env:
          FIREBASE_WEB_API_KEY: ci-placeholder-not-a-credential
  browsers:
    needs: verify
    runs-on: ubuntu-24.04
    # Browser binaries and OS libraries ship together; the lockfile selects the image version.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.verify.outputs.playwright_version }}-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
