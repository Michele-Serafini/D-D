name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test
      - run: npm run lint
      - name: Validate build with test configuration
        run: npm run build
        env:
          FIREBASE_WEB_API_KEY: ci-placeholder-not-a-credential
